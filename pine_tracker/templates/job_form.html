{% extends "base.html" %}
{% block title %}Log a repair{% endblock %}

{% block content %}
<div class="headline">
  <h1>Log a repair</h1>
  <p class="lede">Catch it while you're standing in front of it.</p>
</div>

<form method="post" enctype="multipart/form-data" class="stack">
  <label>
    Property
    <select name="property_id" required autofocus>
      <option value="">Choose one</option>
      {% for p in props %}
      <option value="{{ p.id }}" {% if form.property_id == p.id | string %}selected{% endif %}>{{ p.street }}</option>
      {% endfor %}
    </select>
  </label>

  <label>
    What needs doing
    <input type="text" name="title" value="{{ form.title }}"
           placeholder="Kitchen faucet drips" required>
  </label>

  <label>
    Before photo
    <input type="file" name="photo" accept="image/*" capture="environment">
  </label>

  <label>
    Comment on the photo
    <input type="text" name="caption" placeholder="Drip at the base, not the spout">
  </label>

  <details>
    <summary>Add detail</summary>

    <label>
      Unit
      <select name="unit_id">
        <option value="">Whole property</option>
        {% for u in units %}
        <option value="{{ u.id }}" {% if form.unit_id == u.id | string %}selected{% endif %}>{{ u.label }}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Priority
      <select name="priority">
        <option value="1" {% if form.priority == '1' %}selected{% endif %}>Urgent</option>
        <option value="2" {% if form.priority == '2' %}selected{% endif %}>Soon</option>
        <option value="3" {% if form.priority == '3' %}selected{% endif %}>Normal</option>
        <option value="4" {% if form.priority == '4' %}selected{% endif %}>Whenever</option>
      </select>
    </label>

    <label>
      Notes
      <input type="text" name="description" value="{{ form.description }}"
             placeholder="Tenant reported Tuesday">
    </label>
  </details>

  <button class="action" type="submit">Save repair</button>
</form>
{% endblock %}
