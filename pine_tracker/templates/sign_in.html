{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="headline">
  <h1>Sign in</h1>
  <p class="lede">This tracker holds property and spending records, so it stays behind a password.</p>
</div>

<form method="post" class="stack">
  <label>
    Password
    <input type="password" name="password" required autofocus autocomplete="current-password">
  </label>
  <button class="action wide" type="submit">Sign in</button>
</form>
{% endblock %}
